name: weekly-run
on:
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover and research (drafts wait for your approval, nothing is sent)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          REQUIRE_APPROVAL: "true"
        run: python main.py run --discovered --limit 10
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 14
