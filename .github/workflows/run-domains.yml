name: run-domains
on:
  workflow_dispatch:
    inputs:
      domains:
        description: "Space-separated domains, e.g. acme.com globex.io"
        required: true
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Research the domains (the input goes through an env var, never into the shell line)
        env:
          DOMAINS: ${{ inputs.domains }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          REQUIRE_APPROVAL: "true"
        run: python -c "import os,sys,subprocess; sys.exit(subprocess.call([sys.executable,'main.py','run']+os.environ['DOMAINS'].split()))"
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 14
